<h2>Pokédex</h2>

<p class="mb-1">Tipi:</p>
<div class="d-flex flex-wrap gap-1 mb-4">
  @for (t of tipi(); track t.name) {
    <span class="badge text-bg-secondary">{{ t.name }}</span>
  }
</div>

<div class="row g-2 mb-3">
  <div class="col-auto">
    <input #ricerca type="text" class="form-control" placeholder="pikachu oppure 25" aria-label="Nome o numero del Pokémon" (keyup.enter)="cerca(ricerca.value)">
  </div>
  <div class="col-auto">
    <button type="button" class="btn btn-primary" (click)="cerca(ricerca.value)" [disabled]="loading()">Cerca</button>
  </div>
</div>

@if (loading()) {
  <div class="spinner-border text-primary" role="status"></div>
}
@if (errore()) {
  <div class="alert alert-warning">{{ errore() }}</div>
}

@if (pokemon(); as p) {
  <div class="card" style="max-width: 18rem;">
    @if (p.sprites.front_default) {
      <img [src]="p.sprites.front_default" [alt]="p.name" class="card-img-top">
    }
    <div class="card-body">
      <h3 class="card-title h5 text-capitalize">#{{ p.id }} {{ p.name }}</h3>
      <p class="card-text mb-0">Altezza: {{ p.height / 10 }} m</p>
      <p class="card-text">Peso: {{ p.weight / 10 }} kg</p>
    </div>
  </div>
}
