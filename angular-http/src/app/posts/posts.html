<h2>Post da JSONPlaceholder</h2>

<div class="row g-2 mb-3">
  <div class="col-auto">
    <input #numero type="number" class="form-control" value="1" min="1" aria-label="Numero del post">
  </div>
  <div class="col-auto">
    <button type="button" class="btn btn-primary" (click)="caricaUno(numero.value)">Carica un post</button>
  </div>
</div>

@if (loading()) {
  <div class="spinner-border text-primary mb-3" role="status"></div>
}
@if (errore()) {
  <div class="alert alert-danger">{{ errore() }}</div>
}

@if (post(); as p) {
  <h3 class="h5">Ultima risposta ricevuta (post n. {{ p.id }})</h3>
  <pre class="bg-body-tertiary p-3 rounded">{{ p | json }}</pre>
}
